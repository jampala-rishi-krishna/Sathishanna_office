name: IndexNow URL submission

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'src/**'
      - 'index.html'
      - 'scripts/submit-indexnow.mjs'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify public key and submit sitemap URLs to IndexNow
        run: node scripts/submit-indexnow.mjs

name: GEO quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate GEO metadata and crawlability
        run: npm run validate:geo
      - name: Generate AI visibility and directory audit templates
        run: |
          npm run benchmark:geo -- /tmp/h2h-geo-visibility-baseline.csv
          npm run citations:geo -- /tmp/h2h-directory-citation-audit.csv
          test -s /tmp/h2h-geo-visibility-baseline.csv
          test -s /tmp/h2h-directory-citation-audit.csv
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build production site
        run: npm run build

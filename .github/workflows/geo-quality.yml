name: GEO quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate GEO metadata and crawlability
        run: npm run validate:geo
      - name: Generate and validate GEO measurement templates
        run: |
          npm run benchmark:geo -- /tmp/h2h-geo-visibility-baseline.csv
          npm run summarize:geo -- /tmp/h2h-geo-visibility-baseline.csv /tmp/h2h-geo-visibility-summary.json
          npm run citations:geo -- /tmp/h2h-directory-citation-audit.csv
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const count = readFileSync('/tmp/h2h-geo-visibility-baseline.csv','utf8').trimEnd().split(/\\r?\\n/).length; if (count !== 151) throw new Error('Expected 150 prompt/platform rows plus header; got ' + count); const report = JSON.parse(readFileSync('/tmp/h2h-geo-visibility-summary.json','utf8')); if (report.total_prompt_platform_rows !== 150 || report.completed_tests !== 0) throw new Error('Unexpected GEO summary smoke test');"
          test -s /tmp/h2h-directory-citation-audit.csv
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build production site
        run: npm run build
      - name: Verify Cloudflare Workers routing assets
        run: |
          test -s dist/404.html
          test -s dist/_redirects
          grep -q 'not_found_handling.*404-page' wrangler.jsonc
          grep -q '^/contact /index.html 200 dist/_redirects
          grep -q '^/booking /index.html 200 dist/_redirects
